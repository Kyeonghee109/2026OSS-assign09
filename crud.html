<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            max-width: 600px;
            margin: 0 auto;
            font-family: sans-serif;
            background-color: #f7f7f7;
        }
        form{
            border: 2px solid #ddd;
            padding: 10px;
            border-radius: 3px;
            margin-bottom: 15px;
            background-color: white;
        }
        input{
            width: 200px;
            padding: 4px;
            margin: 2px;
        }
        #search {
            margin-left: 40px;
        }
        
        button{
            background-color: lemonchiffon;
            color: black;
            padding: 5px;
            margin: 2px;
            cursor: pointer;
        }
        li button{
            margin-left: 5px;
        }
    </style>
</head>
<body>
    <form id="movieForm">
        <h2>영화 등록</h2>
        <label for="title">제목</label>
        <input type="text" id="title" name="title" maxlength="30" required><br>

        <label for="director">감독</label>
        <input type="text" id="director" name="director" required><br>

        <label for="year">연도</label>
        <input type="text" id="year" name="year" required><br>

        <label for="genre">장르</label>
        <input type="text" id="genre" name="genre" required><br>

        <label for="rating">평점</label>
        <input type="text" id="rating" name="rating" required><br>

        <button type="submit">등록</button>
    </form>

    <input id="search" placeholder="제목 또는 감독 검색"><br>

    <ul id="movieList"></ul>
    <p id="status"></p>

    <script>
        const API_URL = "https://6adea7084e88f1bba4a53bf7.mockapi.io/movie";
        const status = document.querySelector("#status");
        const form = document.querySelector("#movieForm");
        const search = document.querySelector("#search");
        let editingId = null;
        let allMovies = [];

        async function loadMovies(){
            
            try{
                const response = await fetch(API_URL);      
                if(!response.ok){
                    throw new Error(`HTTP ${response.status}`);
                }

                const movies = await response.json();
                allMovies = movies;
                renderMovies(movies);
            }
            catch(error){
                console.error(error);
                status.textContent = "데이터 요청에 실패했습니다.";
            }
        }
        search.addEventListener("input",()=>{
            const keyword = search.value.toLowerCase();

            const movie = allMovies.filter((movie) => {
                return movie.title.toLowerCase().includes(keyword) || movie.director.toLowerCase().includes(keyword);
            });
            renderMovies(movie);
        });

        function renderMovies(movies) {
            const list = document.getElementById("movieList");
            list.replaceChildren();

            movies.forEach(movie => {
                const li = document.createElement("li");
                li.textContent = `${movie.title} - ${movie.director} (${movie.year}) | ${movie.genre} | ${movie.rating}`;
                const deletebtn = document.createElement("button");
                deletebtn.textContent = "삭제";
                const updatebtn = document.createElement("button");
                updatebtn.textContent = "수정";
                li.appendChild(deletebtn);
                li.appendChild(updatebtn);
                list.appendChild(li);
                deletebtn.addEventListener("click", async() => {
                    if(!confirm(`"${movie.title}"을(를) 삭제할까요?`)){ return; }
                    try{
                        await deleteMovie(movie.id);
                    }
                    catch(error){
                        console.error(error);
                        status.textContent = "삭제에 실패했습니다.";
                    }
                });
                updatebtn.addEventListener("click", ()=>{
                    document.querySelector("#title").value = movie.title;
                    document.querySelector("#director").value = movie.director;
                    document.querySelector("#year").value = movie.year;
                    document.querySelector("#genre").value = movie.genre;
                    document.querySelector("#rating").value = movie.rating;
                    
                    editingId = movie.id;
                    
                });
            });
        }

        async function addMovie(movie){
            const response = await fetch(API_URL,{
                method: "POST",
                headers:{
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(movie)
            });
            if(!response.ok){
                throw new Error(`HTTP ${response.status}`);
            }
            await loadMovies();
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();   

            const newMovie = {
                title: document.querySelector("#title").value,
                director: document.querySelector("#director").value,
                year: Number(document.querySelector("#year").value),
                genre: document.querySelector("#genre").value,
                rating: Number(document.querySelector("#rating").value)
            };

            if(newMovie.year < 1888 || newMovie.year > 2026 || Number.isNaN(newMovie.year)){
                status.textContent = "1888 ~ 2026년도 사이 년도를 입력하세요."; year.focus(); return;
            }
            if(newMovie.rating < 0 || newMovie.rating > 10 || Number.isNaN(newMovie.rating)){
                status.textContent = "평점은 0 ~ 10 사이 숫자를 입력해주세요."; rating.focus(); return;
            }

            try{
                if(editingId == null){
                    await addMovie(newMovie);
                }
                else{
                    await updateMovie(editingId, newMovie);
                }
                form.reset();
                editingId = null;
                status.textContent = "저장되었습니다."
            }
            catch(error){
                console.error(error);
                status.textContent = "등록에 실패했습니다.";
            }

        });
        
        async function updateMovie(id, updateData){
            const response = await fetch(`${API_URL}/${id}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(updateData)
            });
            if(!response.ok){
                throw new Error(`HTTP ${response.status}`);
            }
            await loadMovies();
        }

        async function deleteMovie(id){
            const response = await fetch(`${API_URL}/${id}`,{
                method: "DELETE"
            });
            if(!response.ok){
                throw new Error(`HTTP ${response.status}`);
            }
            await loadMovies();
        }
        
        loadMovies();
    </script>
</body>
</html>

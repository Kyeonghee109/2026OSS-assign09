<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form id="movieForm">
        <h2>영화 등록</h2>
        <label for="title">제목</label>
        <input type="text" id="title" name="title"><br>

        <label for="director">감독</label>
        <input type="text" id="director" name="director"><br>

        <label for="year">연도</label>
        <input type="text" id="year" name="year"><br>

        <label for="genre">장르</label>
        <input type="text" id="genre" name="genre"><br>

        <label for="rating">평점</label>
        <input type="text" id="rating" name="rating"><br>

        <button type="submit">등록</button>
    </form>

    <ul id="movieList"></ul>
    <p id="status"></p>

    <!-- STEP 2. Fetch API로 CRUD 구현

    GET: 시작 시 목록 조회 및 화면 출력
    POST: Form 데이터를 서버에 추가하고 목록 갱신
    PATCH 또는 PUT: 기존 데이터를 불러와 수정하고 서버에 반영
    DELETE: confirm() 후 서버 데이터 삭제
    모든 요청은 fetch()를 이용하고, async/await와 오류 처리를 적용
    Array는 화면 표시·검색 등에 사용할 수 있지만 최종 데이터 저장은 MockAPI에서 수행
    -->
    <script>
        const API_URL = "https://6adea7084e88f1bba4a53bf7.mockapi.io/movie";
        const status = document.querySelector("#status");
        const form = document.querySelector("#movieForm");
        let editingId = null;

        async function loadMovies(){
            
            try{
                const response = await fetch(API_URL);

                if(!response.ok){
                    throw new Error(`HTTP ${response.status}`);
                }

                const movies = await response.json();
                renderMovies(movies);
            }
            catch(error){
                console.error(error);
                status.textContent = "데이터 요청에 실패했습니다.";
            }
        }

        function renderMovies(movies) {
            const list = document.getElementById("movieList");
            list.replaceChildren();

            movies.forEach(movie => {
                const li = document.createElement("li");
                li.textContent = `${movie.title} - ${movie.director} (${movie.year}) | ${movie.genre} | ${movie.rating}`;
                const deletebtn = document.createElement("button");
                deletebtn.textContent = "삭제";
                const updatebtn = document.createElement("button");
                updatebtn.textContent = "수정";
                li.appendChild(deletebtn);
                li.appendChild(updatebtn);
                list.appendChild(li);
                deletebtn.addEventListener("click", async() => {
                    if(!confirm(`"${movie.title}"을(를) 삭제할까요?`)){ return; }
                    try{
                        await deleteMovie(movie.id);
                    }
                    catch(error){
                        console.error(error);
                        status.textContent = "삭제에 실패했습니다.";
                    }
                });
                updatebtn.addEventListener("click", ()=>{
                    document.querySelector("#title").value = movie.title;
                    document.querySelector("#director").value = movie.director;
                    document.querySelector("#year").value = movie.year;
                    document.querySelector("#genre").value = movie.genre;
                    document.querySelector("#rating").value = movie.rating;
                    
                    editingId = movie.id;
                    
                });
            });
        }

        async function addMovie(movie){
            const response = await fetch(API_URL,{
                method: "POST",
                headers:{
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(movie)
            });
            if(!response.ok){
                throw new Error(`HTTP ${response.status}`);
            }
            await loadMovies();
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();   

            const newMovie = {
                title: document.querySelector("#title").value,
                director: document.querySelector("#director").value,
                year: Number(document.querySelector("#year").value),
                genre: document.querySelector("#genre").value,
                rating: Number(document.querySelector("#rating").value)
            };

            try{
                if(editingId == null){
                    await addMovie(newMovie);
                }
                else{
                    await updateMovie(editingId, newMovie);
                }
                form.reset();
                editingId = null;
            }
            catch(error){
                console.error(error);
                status.textContent = "등록에 실패했습니다.";
            }

        });
        
        async function updateMovie(id, updateData){
            const response = await fetch(`${API_URL}/${id}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(updateData)
            });
            if(!response.ok){
                throw new Error(`HTTP ${response.status}`);
            }
            await loadMovies();
        }

        async function deleteMovie(id){
            const response = await fetch(`${API_URL}/${id}`,{
                method: "DELETE"
            });
            if(!response.ok){
                throw new Error(`HTTP ${response.status}`);
            }
            await loadMovies();
        }
        
        
        loadMovies();
    </script>
</body>
</html>
